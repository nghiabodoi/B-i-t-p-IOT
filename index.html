<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soát vé bằng dấu X</title>
<style>
  :root {
    --bg: #e8ecf1;
    --panel: #ffffff;
    --ink: #17202c;
    --muted: #5d6877;
    --line: #cfd6df;
    --ok: #1c8a4b;
    --ok-bg: #e3f4ea;
    --bad: #c4372f;
    --bad-bg: #fbe8e6;
    --idle-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171e;
      --panel: #1b222c;
      --ink: #e8edf3;
      --muted: #9aa5b4;
      --line: #313b49;
      --ok: #4cc27f;
      --ok-bg: #16301f;
      --bad: #ff7a70;
      --bad-bg: #3a1b19;
      --idle-bg: #232b36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 16px 24px;
  }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  .conn { font-size: 0.85rem; color: var(--muted); }
  .conn.lost { color: var(--bad); font-weight: 600; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 20px;
    padding: 0 24px 32px;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 0 14px 24px; } }

  /* Ô trạng thái cổng soát vé */
  .gate {
    background: var(--idle-bg);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    transition: background-color .25s, border-color .25s;
  }
  .gate.ok  { background: var(--ok-bg);  border-color: var(--ok); }
  .gate.bad { background: var(--bad-bg); border-color: var(--bad); }
  .gate .status { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; line-height: 1.1; margin: 0; }
  .gate.ok .status  { color: var(--ok); }
  .gate.bad .status { color: var(--bad); }
  .gate .sub { color: var(--muted); margin: 6px 0 16px; }
  .gate img {
    display: block; width: 100%; border-radius: 6px;
    border: 1px solid var(--line); background: #000;
  }
  .gate .placeholder {
    border: 2px dashed var(--line); border-radius: 6px;
    padding: 48px 16px; text-align: center; color: var(--muted);
  }

  aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px;
  }
  .stat b { display: block; font-size: 1.6rem; line-height: 1.2; }
  .stat span { font-size: 0.82rem; color: var(--muted); }
  .stat.ok b { color: var(--ok); }
  .stat.bad b { color: var(--bad); }

  .history {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
  }
  .history h2 { font-size: 0.95rem; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .list { max-height: 420px; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover, .row:focus-visible { background: var(--idle-bg); outline: none; }
  .row img { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; flex: none; background: #000; }
  .row .t { font-variant-numeric: tabular-nums; }
  .row .d { font-size: 0.8rem; color: var(--muted); }
  .tag { margin-left: auto; font-weight: 700; font-size: 0.85rem; }
  .tag.ok { color: var(--ok); }
  .tag.bad { color: var(--bad); }
  .empty { padding: 24px 14px; color: var(--muted); text-align: center; }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  button, .filebtn {
    font: inherit; font-size: 0.9rem; cursor: pointer;
    padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover, .filebtn:hover { border-color: var(--muted); }
  button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--muted); outline-offset: 2px; }
  .filebtn input { position: absolute; opacity: 0; width: 0; height: 0; }
  .hint { font-size: 0.82rem; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Soát vé bằng dấu X</h1>
  <div id="conn" class="conn">Đang kết nối…</div>
</header>

<main>
  <section id="gate" class="gate" aria-live="polite">
    <p id="status" class="status">Đang chờ vé</p>
    <p id="sub" class="sub">Đưa tay có dấu đóng vào trước camera.</p>
    <div id="view"><div class="placeholder">Chưa có ảnh nào</div></div>
  </section>

  <aside>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Tổng lượt quét</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Hợp lệ</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Không hợp lệ</span></div>
    </div>

    <div class="history">
      <h2>Lịch sử quét</h2>
      <div id="list" class="list"><div class="empty">Chưa có lượt quét nào.</div></div>
    </div>

    <div class="tools">
      <label class="filebtn">Thử bằng ảnh có sẵn
        <input id="file" type="file" accept="image/*">
      </label>
      <button id="clear" type="button">Xóa lịch sử</button>
    </div>
    <p class="hint">Bấm vào một dòng trong lịch sử để xem lại ảnh. Viền vàng là vùng mực máy tìm được, nét xanh là hai nét tạo thành dấu X.</p>
  </aside>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let events = [];
  let selectedId = null;   // null = luôn hiển thị lượt quét mới nhất
  let lastTopId = null;

  function renderGate(ev) {
    const gate = $("gate");
    if (!ev) {
      gate.className = "gate";
      $("status").textContent = "Đang chờ vé";
      $("sub").textContent = "Đưa tay có dấu đóng vào trước camera.";
      $("view").innerHTML = '<div class="placeholder">Chưa có ảnh nào</div>';
      return;
    }
    gate.className = "gate " + (ev.valid ? "ok" : "bad");
    $("status").textContent = ev.valid ? "Vé hợp lệ" : "Không hợp lệ";
    $("sub").textContent = ev.date + " " + ev.time + (ev.valid ? " - mời vào" : " - không thấy dấu X");
    $("view").innerHTML = '<img alt="Ảnh bàn tay đã phân tích" src="/captures/' + ev.image + '">';
  }

  function renderList() {
    const list = $("list");
    if (!events.length) {
      list.innerHTML = '<div class="empty">Chưa có lượt quét nào.</div>';
      return;
    }
    list.innerHTML = events.map((e) =>
      '<div class="row" tabindex="0" data-id="' + e.id + '">' +
        '<img alt="" src="/captures/' + e.image + '">' +
        '<div><div class="t">' + e.time + '</div><div class="d">' + e.date + '</div></div>' +
        '<span class="tag ' + (e.valid ? "ok" : "bad") + '">' + (e.valid ? "Hợp lệ" : "Không hợp lệ") + '</span>' +
      '</div>'
    ).join("");
  }

  async function refresh() {
    try {
      const r = await fetch("/api/events", { cache: "no-store" });
      const data = await r.json();
      $("conn").textContent = "Đã kết nối";
      $("conn").className = "conn";

      events = data.events;
      $("sTotal").textContent = data.stats.total;
      $("sOk").textContent = data.stats.valid;
      $("sBad").textContent = data.stats.invalid;

      const topId = events.length ? events[0].id : null;
      if (topId !== lastTopId) {      // có lượt quét mới -> quay về hiển thị mới nhất
        selectedId = null;
        lastTopId = topId;
        renderList();
      }
      const shown = selectedId ? events.find((e) => e.id === selectedId) : events[0];
      renderGate(shown);
    } catch (err) {
      $("conn").textContent = "Mất kết nối với server";
      $("conn").className = "conn lost";
    }
  }

  $("list").addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    selectedId = row.dataset.id;
    renderGate(events.find((x) => x.id === selectedId));
  });
  $("list").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const row = e.target.closest(".row");
      if (row) { e.preventDefault(); row.click(); }
    }
  });

  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = await fetch("/upload", { method: "POST", body: f });
    if (!r.ok) alert("Server không đọc được ảnh này.");
    e.target.value = "";
    refresh();
  });

  $("clear").addEventListener("click", async () => {
    if (!confirm("Xóa toàn bộ lịch sử và ảnh đã lưu?")) return;
    await fetch("/api/clear", { method: "POST" });
    selectedId = null; lastTopId = null;
    refresh();
  });

  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
